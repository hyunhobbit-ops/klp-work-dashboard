<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KLP KOREA - 업무 대시보드</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-top">
                <div class="logo">
                    <div class="logo-icon">K</div>
                    <span class="logo-text">KLP KOREA</span>
                </div>
                <button class="sidebar-close" id="sidebarClose">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <nav class="sidebar-nav">
                <button class="nav-item active" data-tab="dashboard">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1h-2z"/></svg>
                    <span>홈 대시보드</span>
                </button>
                <button class="nav-item" data-tab="projects">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
                    <span>프로젝트 진행사항</span>
                </button>
                <button class="nav-item" data-tab="daily">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    <span>일일계획표</span>
                </button>
                <button class="nav-item" data-tab="delivery">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 7l-8 8-4-4M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                    <span>택배 관리</span>
                </button>
            </nav>
            <div class="sidebar-footer">
                <div class="sidebar-user">
                    <div class="user-avatar">KH</div>
                    <div class="user-info">
                        <span class="user-name">김현호</span>
                        <span class="user-role">KLP KOREA</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Sidebar Overlay (mobile) -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- Main Content -->
        <div class="main-wrap">
            <!-- Top Bar -->
            <header class="topbar">
                <div class="topbar-left">
                    <button class="hamburger" id="hamburger">
                        <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
                    </button>
                    <h1 class="page-title" id="pageTitle">홈 대시보드</h1>
                </div>
                <div class="topbar-right">
                    <span class="topbar-date" id="topbarDate"></span>
                </div>
            </header>

            <!-- ===== Dashboard ===== -->
            <main class="content active" id="tab-dashboard">
                <!-- Summary Row -->
                <div class="summary-row">
                    <div class="summary-card">
                        <div class="summary-icon blue">
                            <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
                        </div>
                        <div class="summary-info">
                            <span class="summary-label">진행 중 프로젝트</span>
                            <span class="summary-value" id="activeProjects">0</span>
                        </div>
                    </div>
                    <div class="summary-card">
                        <div class="summary-icon orange">
                            <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                        </div>
                        <div class="summary-info">
                            <span class="summary-label">오늘 할 일</span>
                            <span class="summary-value" id="todayTasks">0</span>
                        </div>
                    </div>
                    <div class="summary-card">
                        <div class="summary-icon green">
                            <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                        </div>
                        <div class="summary-info">
                            <span class="summary-label">오늘 완료율</span>
                            <span class="summary-value" id="completionRate">0%</span>
                        </div>
                    </div>
                    <div class="summary-card">
                        <div class="summary-icon purple">
                            <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/></svg>
                        </div>
                        <div class="summary-info">
                            <span class="summary-label">이번 달 택배</span>
                            <span class="summary-value" id="monthDelivery">0</span>
                        </div>
                    </div>
                </div>

                <!-- Dashboard Grid -->
                <div class="dash-grid">
                    <!-- Urgent -->
                    <div class="dash-panel">
                        <div class="panel-header">
                            <h2 class="panel-title">긴급 항목</h2>
                            <span class="panel-badge red" id="urgentCount">0</span>
                        </div>
                        <div class="panel-body" id="urgentList"></div>
                    </div>
                    <!-- Today Tasks -->
                    <div class="dash-panel">
                        <div class="panel-header">
                            <h2 class="panel-title">오늘의 할 일</h2>
                            <button class="panel-link" onclick="switchTab('daily')">전체보기 &rarr;</button>
                        </div>
                        <div class="panel-body" id="todaySchedule"></div>
                    </div>
                    <!-- Project Progress -->
                    <div class="dash-panel">
                        <div class="panel-header">
                            <h2 class="panel-title">프로젝트 현황</h2>
                            <button class="panel-link" onclick="switchTab('projects')">전체보기 &rarr;</button>
                        </div>
                        <div class="panel-body" id="dashProjects"></div>
                    </div>
                    <!-- Recent Deliveries -->
                    <div class="dash-panel">
                        <div class="panel-header">
                            <h2 class="panel-title">최근 택배</h2>
                            <button class="panel-link" onclick="switchTab('delivery')">전체보기 &rarr;</button>
                        </div>
                        <div class="panel-body" id="recentDeliveries"></div>
                    </div>
                </div>
            </main>

            <!-- ===== Projects ===== -->
            <main class="content" id="tab-projects">
                <div class="content-toolbar">
                    <div class="filter-bar">
                        <button class="filter-chip active" data-filter="all">전체</button>
                        <button class="filter-chip" data-filter="진행 중">진행 중</button>
                        <button class="filter-chip" data-filter="시작 전">시작 전</button>
                        <button class="filter-chip" data-filter="완료">완료</button>
                    </div>
                    <button class="btn-primary" onclick="openModal('project')">
                        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 5v14m-7-7h14"/></svg>
                        새 프로젝트
                    </button>
                </div>
                <div class="table-wrap">
                    <table class="data-table" id="projectTable">
                        <thead>
                            <tr>
                                <th>프로젝트명</th>
                                <th>상태</th>
                                <th>우선순위</th>
                                <th>카테고리</th>
                                <th>담당</th>
                                <th>마감일</th>
                                <th>진행률</th>
                                <th>체크리스트</th>
                            </tr>
                        </thead>
                        <tbody id="projectTableBody"></tbody>
                    </table>
                </div>
                <!-- Card view for smaller screens -->
                <div class="card-grid" id="projectCardGrid"></div>
            </main>

            <!-- ===== Daily Plan ===== -->
            <main class="content" id="tab-daily">
                <div class="content-toolbar">
                    <div class="toolbar-left">
                        <div class="date-selector">
                            <button class="date-arrow" id="prevDate">
                                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>
                            </button>
                            <span class="date-display" id="currentDateDisplay"></span>
                            <button class="date-arrow" id="nextDate">
                                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
                            </button>
                        </div>
                        <div class="filter-bar">
                            <button class="filter-chip active" data-person="all">전체</button>
                            <button class="filter-chip" data-person="이현주">이현주</button>
                            <button class="filter-chip" data-person="김현호">김현호</button>
                            <button class="filter-chip" data-person="유지은">유지은</button>
                            <button class="filter-chip" data-person="구정두">구정두</button>
                        </div>
                    </div>
                    <button class="btn-primary" onclick="openModal('daily')">
                        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 5v14m-7-7h14"/></svg>
                        새 할 일
                    </button>
                </div>
                <div class="daily-columns" id="dailyColumns">
                    <!-- Will be populated by JS -->
                </div>
            </main>

            <!-- ===== Delivery ===== -->
            <main class="content" id="tab-delivery">
                <div class="content-toolbar">
                    <div class="toolbar-left">
                        <div class="filter-bar">
                            <button class="filter-chip active" data-dtype="all">전체</button>
                            <button class="filter-chip" data-dtype="일반">일반</button>
                            <button class="filter-chip" data-dtype="번개">번개</button>
                            <button class="filter-chip" data-dtype="중고">중고</button>
                            <button class="filter-chip" data-dtype="당근">당근</button>
                            <button class="filter-chip" data-dtype="ETSY">ETSY</button>
                        </div>
                        <div class="search-bar">
                            <svg width="16" height="16" fill="none" stroke="#999" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                            <input type="text" id="deliverySearch" placeholder="받는이, 상품명, 운송장번호 검색">
                        </div>
                    </div>
                    <button class="btn-primary" onclick="openModal('delivery')">
                        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 5v14m-7-7h14"/></svg>
                        새 택배
                    </button>
                </div>
                <div class="table-wrap">
                    <table class="data-table" id="deliveryTable">
                        <thead>
                            <tr>
                                <th>날짜</th>
                                <th>종류</th>
                                <th>발송인</th>
                                <th>받는이</th>
                                <th>상품명</th>
                                <th>주소</th>
                                <th>선/착불</th>
                                <th>판매가</th>
                                <th>운송장번호</th>
                                <th>평가</th>
                            </tr>
                        </thead>
                        <tbody id="deliveryTableBody"></tbody>
                    </table>
                </div>
                <div class="card-grid" id="deliveryCardGrid"></div>
            </main>
        </div>
    </div>

    <!-- Modal Overlay -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">새 항목 추가</h3>
                <button class="modal-close" onclick="closeModal()">
                    <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <!-- Detail Panel -->
    <div class="detail-overlay" id="detailOverlay">
        <div class="detail-panel" onclick="event.stopPropagation()">
            <div class="detail-panel-header">
                <h3 class="detail-panel-title" id="detailPanelTitle">상세 정보</h3>
                <button class="modal-close" onclick="closeDetail()">
                    <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="detail-panel-body" id="detailContent"></div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script src="app.js"></script>
</body>
</html>
