<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>카카오톡 연결 중…</title>
<style>body{font-family:Pretendard,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;color:#4b5563;background:#fff}</style>
</head>
<body>
<p>카카오톡 연결 중…</p>
<script>
// 카카오 로그인에서 돌아오는 곳 — 받은 code/state를 이 탭에만 잠깐 두고 대시보드로 (app.js kakaoInit이 마저 처리)
(function () {
    var q = new URLSearchParams(location.search);
    try {
        sessionStorage.setItem('klp_kakao_cb', JSON.stringify({
            code: q.get('code') || '', state: q.get('state') || '',
            error: q.get('error') || '', desc: q.get('error_description') || ''
        }));
    } catch (e) {}
    location.replace('/');
})();
</script>
</body>
</html>
